name: CI

on:
  push:
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint & Test (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Ruff lint check
        run: |
          ruff check .

      - name: Ruff format check
        run: |
          ruff format --check .

      - name: Pytest
        run: |
          pytest -v --tb=short

      - name: CLI smoke test
        run: |
          kernelsmith --help
          kernelsmith list-operators
          kernelsmith list-targets
          kernelsmith optimize --help
          kernelsmith benchmark --help
          kernelsmith validate --help

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: kernelsmith:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify toolchain inside image
        run: |
          docker run --rm kernelsmith:ci arm-none-eabi-gcc --version
          docker run --rm kernelsmith:ci qemu-arm --version
          docker run --rm kernelsmith:ci qemu-system-arm --version
          docker run --rm kernelsmith:ci kernelsmith --help
